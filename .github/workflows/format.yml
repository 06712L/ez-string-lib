name: Format
on: [ push ]
permissions: 
    contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Xmake repository
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'

      - name: Install format-plugin
        run: xmake addon --yes --install format-plugin

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Start Format
        run: xmake format -a

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --staged --quiet; then
            git commit -m "style: auto format [skip ci]"
            git push
          fi

  add-SPDX-identifier:
    needs: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check and add SPDX identifier
        run: |
          find src test -type f \( \
              -name '*.c' -o \
              -name '*.h' -o \
              -name '*.cpp' -o \
              -name '*.hpp' \
          \) -exec sh -c '
              for file do
                  if ! grep -q "SPDX-License-Identifier: MIT" "$file"; then
                      sed -i "1i// SPDX-License-Identifier: MIT" "$file"
                  fi
              done
          ' sh {} +

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --staged --quiet; then
            git commit -m "chore: add SPDX identifier to the first line [skip ci]"
            git push
          fi
